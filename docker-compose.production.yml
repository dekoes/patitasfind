# Infraestructura de GuauWoow para producción (~5000 usuarios, picos de 300-800 simultáneos).
# - PostgreSQL 16 afinado + respaldos diarios cifrados (pg_dump 14 días + fotos incrementales)
#   y copia externa cifrada opcional a S3/R2 (rclone crypt)
# - Redis (caché, broker de Celery, pub/sub del chat, límites)
# - Backend FastAPI (WEB_CONCURRENCY workers, escalable: sin container_name ni puerto fijo),
#   Celery worker y beat (horario persistente)
# - Nginx con HTTPS (Let's Encrypt), HSTS, CSP y renovación automática con certbot
# Tamaño de referencia: servidor de 4 vCPU / 8 GB. Para 8 vCPU / 16 GB ver los comentarios
# "8/16" (y docs/operacion.md).
#
# Uso (ver README-despliegue.md y docs/operacion.md):
#   cp .env.example .env   # y completa los valores reales (DOMAIN, SECRET_KEY, POSTGRES_PASSWORD,
#                          # BACKUP_ENCRYPTION_PASSWORD, ...)
#   NGINX_MODE=http-only ./backend/scripts/deploy.sh                                    # 1a vez (sin certificado)
#   docker compose -f docker-compose.production.yml run --rm certbot certonly ...      # emitir cert
#   ./backend/scripts/deploy.sh                                                         # HTTPS + despliegue
#   docker compose -f docker-compose.production.yml exec backend python -m app.cli create-admin tu@correo.mx 'ContraseñaSegura'
# Despliegues siguientes: ./backend/scripts/deploy.sh --pull   |   reversa: ./backend/scripts/rollback.sh <tag>

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Imagen única del backend (API, worker y beat). deploy.sh la construye con BACKEND_TAG=<sha del commit>
# y la etiqueta también como latest; rollback.sh vuelve a una etiqueta anterior.
# GIT_SHA queda dentro de la imagen (Sentry lo usa como release), no se pasa en environment.
x-backend-image: &backend-image
  image: patitasfind-backend:${BACKEND_TAG:-latest}
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-dev}

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-patitasfind}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-patitasfind}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  # Pool por proceso (cuenta en app/database.py): 4 workers x (5+5) + Celery 4 x (2+2) << max_connections=150
  DB_POOL_SIZE: ${DB_POOL_SIZE:-}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-}
  DB_WORKER_POOL_SIZE: ${DB_WORKER_POOL_SIZE:-}
  DB_WORKER_MAX_OVERFLOW: ${DB_WORKER_MAX_OVERFLOW:-}
  SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
