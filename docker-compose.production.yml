  AUTHORITY_CONTACT_EMAIL: ${AUTHORITY_CONTACT_EMAIL:-}
  AUTHORITY_CONTACT_PHONE: ${AUTHORITY_CONTACT_PHONE:-}
  AUTHORITY_FIRST_RESPONSE_URGENT_MINUTES: ${AUTHORITY_FIRST_RESPONSE_URGENT_MINUTES:-}
  AUTHORITY_FIRST_RESPONSE_HOURS: ${AUTHORITY_FIRST_RESPONSE_HOURS:-}
  MODERATION_URGENT_HOURS: ${MODERATION_URGENT_HOURS:-}
  MODERATION_MINOR_RESPONSE_HOURS: ${MODERATION_MINOR_RESPONSE_HOURS:-}
  MODERATION_REVIEW_BUSINESS_DAYS: ${MODERATION_REVIEW_BUSINESS_DAYS:-}
  APPEAL_WINDOW_DAYS: ${APPEAL_WINDOW_DAYS:-}
  APPEAL_RESOLUTION_BUSINESS_DAYS: ${APPEAL_RESOLUTION_BUSINESS_DAYS:-}
  COPYRIGHT_REMOVAL_BUSINESS_DAYS: ${COPYRIGHT_REMOVAL_BUSINESS_DAYS:-}
  COPYRIGHT_STRIKES_SUSPEND: ${COPYRIGHT_STRIKES_SUSPEND:-}
  COPYRIGHT_STRIKES_CANCEL: ${COPYRIGHT_STRIKES_CANCEL:-}
  COPYRIGHT_SUSPENSION_DAYS: ${COPYRIGHT_SUSPENSION_DAYS:-}
  EVIDENCE_RETENTION_BUSINESS_DAYS: ${EVIDENCE_RETENTION_BUSINESS_DAYS:-}
  EVIDENCE_DIR: ${EVIDENCE_DIR:-}
  PUBLIC_REPORTS_HOURLY_LIMIT: ${PUBLIC_REPORTS_HOURLY_LIMIT:-}
  COMPLAINT_FIRST_RESPONSE_BUSINESS_DAYS: ${COMPLAINT_FIRST_RESPONSE_BUSINESS_DAYS:-}
  COMPLAINT_RESPONSE_BUSINESS_DAYS: ${COMPLAINT_RESPONSE_BUSINESS_DAYS:-}
  IMPORTED_REMOVAL_PURGE_HOURS: ${IMPORTED_REMOVAL_PURGE_HOURS:-}
  TRANSPARENCY_MIN_CASES: ${TRANSPARENCY_MIN_CASES:-}

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: patitasfind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patitasfind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-patitasfind}
    # Afinado para 4 vCPU / 8 GB (8/16: PG_SHARED_BUFFERS=4GB, PG_EFFECTIVE_CACHE_SIZE=10GB).
    # Cambiar estos valores reinicia PostgreSQL: hazlo en una ventana de mantenimiento.
    command:
      - postgres
      - -c
      - max_connections=150
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=2GB
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      # Estadísticas de consultas (CREATE EXTENSION pg_stat_statements; ver docs/operacion.md)
      - -c
      - shared_preload_libraries=pg_stat_statements
    shm_size: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patitasfind} -d ${POSTGRES_DB:-patitasfind}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4.11-alpine
    container_name: patitasfind-redis
    # volatile-lru: al llenarse solo se desalojan claves con TTL (caché, límites, resultados);
    # las colas de Celery no tienen TTL y nunca se pierden.
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # Sin container_name ni puerto en el host: Nginx lo alcanza por el nombre del servicio y
  # deploy.sh puede levantar una segunda réplica durante el despliegue (rolling update).
  # Comandos: docker compose -f docker-compose.production.yml exec backend <comando>
  backend:
    <<: *backend-image
    environment:
      <<: *backend-env
      # Las migraciones (Alembic, app/migrate.py) las corre deploy.sh UNA vez antes de cambiar contenedores.
      # Desactivadas al arrancar: varias réplicas no compiten y una imagen vieja (rollback.sh) no intenta
      # "migrar" una base más nueva. A mano: docker compose -f docker-compose.production.yml run --rm backend python -m app.migrate
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    # --proxy-headers: respeta X-Forwarded-Proto/For que envía Nginx.
    # --timeout-keep-alive 65 > keepalive_timeout del upstream en Nginx (30 s): evita 502 por conexiones cerradas.
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4}
      --proxy-headers --forwarded-allow-ips=* --timeout-keep-alive 65 --timeout-graceful-shutdown 25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    # Hostinger KVM 2 (2 vCPU / 8 GB): 1.5 CPUs y 3 GB (WEB_CONCURRENCY=4). 4 vCPU / 8 GB: cpus "3".
    # 8/16: cpus "6", memory 6G y WEB_CONCURRENCY=8 (revisa la cuenta de conexiones en app/database.py).
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3G

  celery-worker:
    <<: *backend-image
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    command: celery -A app.celery_app worker -l info -Q whatsapp,facebook,default --concurrency=${CELERY_CONCURRENCY:-4}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    # Apagado en caliente: termina las tareas en curso antes de salir
    stop_grace_period: 120s
    restart: unless-stopped
    logging: *default-logging
    # 8/16: CELERY_CONCURRENCY=8 y memory 3G
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  # Debe haber UNA sola instancia de beat (container_name lo garantiza).
  celery-beat:
    <<: *backend-image
    container_name: patitasfind-celery-beat
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    # El horario (última ejecución de cada tarea) persiste en un volumen: un reinicio no repite ni salta tareas
    command: celery -A app.celery_app beat -l info --schedule /var/lib/celery/celerybeat-schedule
    volumes:
      - celery_beat:/var/lib/celery
    # Beat reescribe el archivo de horario al enviar tareas (al menos cada hora: photo-signature-backfill).
    # Si no cambia en 2 h, beat está colgado.
    healthcheck:
      test: ["CMD-SHELL", "find /var/lib/celery -maxdepth 1 -name 'celerybeat-schedule*' -mmin -120 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 1m
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:1.30.5-alpine
    container_name: patitasfind-nginx
    ports:
      - "127.0.0.1:4700:80"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env (p. ej. guauwoow.com, sin https://)}
      # none (sin proxy delante) | cloudflare (DNS con proxy de Cloudflare: IP real desde CF-Connecting-IP)
      NGINX_REAL_IP: ${NGINX_REAL_IP:-none}
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|NGINX_REAL_IP)$$"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # NGINX_MODE=https (normal) | http-only (solo para emitir el primer certificado)
      - ./nginx/templates/${NGINX_MODE:-http-only}:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Todo el frontend se monta una sola vez; las location deciden qué se sirve
      # (y bloquean archivos de desarrollo: *.py, *.mjs, node_modules/, test-*, etc.)
      - ./app:/usr/share/nginx/html/app:ro
      # /uploads/private/ (documentos de refugios) nunca se sirve: la location lo niega
      - ./backend/uploads:/usr/share/nginx/html/uploads:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Recarga la configuración cada 12 h para tomar certificados renovados por certbot
    entrypoint: ["/bin/sh", "-c", "(while :; do sleep 12h; nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    # Sin depends_on del backend: Nginx resuelve "backend" por DNS en cada petición (resolver de
    # Docker), arranca aunque el backend no exista aún y sigue a los contenedores nuevos.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  certbot:
    image: certbot/certbot:v5.8.0
    container_name: patitasfind-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Intenta renovar cada 12 h (solo renueva si faltan < 30 días); nginx recarga cada 12 h.
    # Para emitir el primer certificado: docker compose ... run --rm certbot certonly ... (ver README)
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: unless-stopped
    logging: *default-logging

  # Respaldo local diario (scripts/backup.sh): pg_dump cifrado con BACKUP_ENCRYPTION_PASSWORD
  # (14 días) + fotos en instantáneas incrementales con enlaces duros + revisión de disco cada hora.
  # La imagen es postgres (pg_dump de la misma versión) + openssl.
  backup:
    build:
      context: ./backend/scripts
      dockerfile_inline: |
        FROM postgres:16.15-alpine
        RUN apk add --no-cache openssl
    image: patitasfind-backup:16.15
    container_name: patitasfind-backup
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-patitasfind}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-patitasfind}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Hora local (TZ) del respaldo diario; vacía = cada BACKUP_INTERVAL_SECONDS desde el último
      BACKUP_HOUR: ${BACKUP_HOUR-3}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      # Obligatoria: sin ella no se generan respaldos. Guárdala fuera del servidor (gestor de contraseñas):
      # sin esta contraseña los respaldos NO se pueden restaurar.
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:?Define BACKUP_ENCRYPTION_PASSWORD en .env (cifra los respaldos)}
      BACKUP_REQUIRE_ENCRYPTION: "true"
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      DISK_ALERT_URL: ${DISK_ALERT_URL:-}
      DISK_ALERT_THRESHOLD: ${DISK_ALERT_THRESHOLD:-85}
      DISK_CHECK_INTERVAL_SECONDS: ${DISK_CHECK_INTERVAL_SECONDS:-3600}
      # "/" = disco de Docker (volúmenes de PostgreSQL y Redis); /backups y /uploads = disco del proyecto
      DISK_CHECK_PATHS: / /backups /uploads
      TZ: America/Mexico_City
    volumes:
      - ./backups:/backups
      - ./backend/uploads:/uploads:ro
      - ./backend/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup.sh", "loop"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/scripts/backup.sh", "health"]
      interval: 10m
      timeout: 30s
      retries: 2
      start_period: 2h
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # Copia externa cifrada (rclone crypt sobre S3 / Cloudflare R2) de los dumps y de las fotos
  # (sincronización incremental + archivo de borrados). Si BACKUP_S3_BUCKET está vacío queda
  # inactivo (y backup.sh lo advierte en cada vuelta).
  backup-offsite:
    image: rclone/rclone:1.75.1
    container_name: patitasfind-backup-offsite
    environment:
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-patitasfind}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_OFFSITE_HOUR: ${BACKUP_OFFSITE_HOUR-4}
      BACKUP_OFFSITE_RETENTION_DAYS: ${BACKUP_OFFSITE_RETENTION_DAYS:-30}
      BACKUP_OFFSITE_HEARTBEAT_URL: ${BACKUP_OFFSITE_HEARTBEAT_URL:-}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:?Define BACKUP_ENCRYPTION_PASSWORD en .env (cifra los respaldos)}
      BACKUP_ENCRYPTION_SALT: ${BACKUP_ENCRYPTION_SALT:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-auto}
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
      TZ: America/Mexico_City
    volumes:
      - ./backups:/backups:ro
      - ./backend/uploads:/uploads:ro
      - ./backend/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup-offsite.sh"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/scripts/backup-offsite.sh", "health"]
      interval: 10m
      timeout: 30s
      retries: 2
      start_period: 3h
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  celery_beat:
