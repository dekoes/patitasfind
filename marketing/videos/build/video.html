<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>GuauWoow · video</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"></div>
<script src="engine.js"></script>
<script src="compuestos.js"></script>
<script>
  // Carga el guion del video pedido (?v=adopcion | ?v=perdido) y avisa cuando todo está listo para renderizar
  const v = new URLSearchParams(location.search).get('v') || 'adopcion';
  const s = document.createElement('script');
  s.src = v + '.js';
  s.onload = async () => {
    await document.fonts.ready;
    await Promise.all(['Baloo 2', 'Lilita One', 'Bungee', 'Caveat', 'Gochi Hand'].map(f => document.fonts.load(`700 80px "${f}"`)));
    await Promise.all([...document.images].map(i => i.decode().catch(() => null)));
    window.renderFrame(Number(new URLSearchParams(location.search).get('t') || 0));
    window.__ready = true;
  };
  document.body.appendChild(s);
</script>
</body>
</html>
