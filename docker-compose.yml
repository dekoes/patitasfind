# Entorno de DESARROLLO de PatitasFind
#   docker compose up -d --build
# Puertos en el host: PostgreSQL 5433 (POSTGRES_HOST_PORT), backend 8001.
# Redis no se expone al host (solo red interna). Las integraciones externas quedan
# desactivadas mientras sus variables estén vacías (ver .env.example).

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://patitasfind:patitasfind@postgres:5432/patitasfind}
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8082}
  ALLOW_DEMO_LOGIN: ${ALLOW_DEMO_LOGIN:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:3000,http://127.0.0.1:5500,http://127.0.0.1:8082}
  CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-https://.*\.trycloudflare\.com}
  UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  USE_CELERY: ${USE_CELERY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8001/auth/google/callback}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
  ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-low}
  MATCH_SCORE_THRESHOLD: ${MATCH_SCORE_THRESHOLD:-60}
  MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
  MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
  TWILIO_CHANNEL: ${TWILIO_CHANNEL:-sms}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-patitasfind-dev-token}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v21.0}
  FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}

services:
  postgres:
    image: postgres:16
    container_name: patitasfind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patitasfind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patitasfind}
      POSTGRES_DB: ${POSTGRES_DB:-patitasfind}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patitasfind} -d ${POSTGRES_DB:-patitasfind}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: patitasfind-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patitasfind-backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
      WATCHFILES_FORCE_POLLING: "true"  # --reload fiable con volúmenes de Docker Desktop (macOS)
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patitasfind-celery-dev
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    # -B ejecuta también Celery Beat (solo para desarrollo)
    command: celery -A app.celery_app worker -B -l info -Q whatsapp,facebook,default --concurrency=2

volumes:
  postgres_data:
