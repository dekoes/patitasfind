# Imagen de desarrollo (con pytest/httpx). Etiqueta propia ":dev" para no chocar con la de producción.
x-backend-build: &backend-build
  image: patitasfind-backend:dev
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      INSTALL_DEV: "true"
  user: ${DEV_USER:-app}

services:
  postgres:
    # Debian (no alpine) a propósito: cambiar de libc altera las intercalaciones de una base existente
    image: postgres:16.15-trixie
    container_name: patitasfind-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patitasfind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patitasfind}
      POSTGRES_DB: ${POSTGRES_DB:-patitasfind}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patitasfind} -d ${POSTGRES_DB:-patitasfind}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.11-alpine
    container_name: patitasfind-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    <<: *backend-build
    container_name: patitasfind-backend
    environment:
      <<: *backend-env
      # Mismo camino que producción: Alembic (python -m app.migrate) al arrancar; la app ya no hace create_all
      RUN_MIGRATIONS: "true"
      WATCHFILES_FORCE_POLLING: "true"  # --reload fiable con volúmenes de Docker Desktop (macOS)
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    <<: *backend-build
    container_name: patitasfind-celery-dev
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    # -B ejecuta también Celery Beat (solo para desarrollo)
    command: celery -A app.celery_app worker -B -l info -Q whatsapp,facebook,default --concurrency=2

volumes:
  postgres_data:
