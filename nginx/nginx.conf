events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    sendfile on;
    client_max_body_size 12m;          # fotos de hasta 10 MB + margen multipart

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    # WebSocket: Upgrade/Connection solo cuando el cliente los pide
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # Archivos del frontend montados en /usr/share/nginx/html/app (landing, app y admin)
    # Encabezados comunes para todo lo que se envía al backend (se heredan en cada location)

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;

        # Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # En producción con HTTPS activo, reemplaza todo este bloque por:
        # location / { return 301 https://$host$request_uri; }
        # (dejando la location de acme-challenge)

        # ---------------- Landing (/) y sus assets
        location = / {
            root /usr/share/nginx/html/app;
            try_files /landing.html =404;
            add_header Cache-Control "public, max-age=300";
        }
        location = /index.html {
            return 301 /;
        }
        # landing.css, landing.js, favicon y cualquier archivo estático de primer nivel;
        # si no existe en el frontend, se envía al backend (nunca coincide con rutas de la API)
        location ~* ^/[^/]+\.(css|js|png|jpe?g|webp|svg|ico|gif|woff2?|ttf|webmanifest|txt)$ {
            root /usr/share/nginx/html/app;
            try_files $uri @backend;
            expires 1h;
        }
        location /img/ {
            root /usr/share/nginx/html/app;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ---------------- App web
        location = /app {
            return 302 /app/;
        }
        location /app/ {
            alias /usr/share/nginx/html/app/;
            try_files $uri $uri/ /app/index.html;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # ---------------- Panel de administración (solo estos archivos son estáticos;
        # cualquier otra ruta /admin/... es API y va al backend)
        location = /admin {
            return 302 /admin/;
        }
        location = /admin/ {
            root /usr/share/nginx/html/app;
            try_files /admin.html =404;
            add_header Cache-Control "no-cache";
        }
        location = /admin/index.html {
            root /usr/share/nginx/html/app;
            try_files /admin.html =404;
            add_header Cache-Control "no-cache";
        }
        location = /admin/admin.css {
            alias /usr/share/nginx/html/app/admin.css;
            default_type text/css;
        }
        location = /admin/admin.js {
            alias /usr/share/nginx/html/app/admin.js;
            default_type application/javascript;
        }

        # ---------------- Uploads
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff;
        }

        # ---------------- Endpoints sensibles con límite estricto
        location = /auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
        }
        location = /auth/forgot-password {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
        }

        # ---------------- WebSocket del chat
        location /ws/ {
            proxy_pass http://backend;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ---------------- Búsqueda por foto / IA (subidas y respuestas más lentas)
        location /search/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_read_timeout 120s;
        }
        location /ai/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_read_timeout 120s;
        }

        # ---------------- Todo lo demás es API (incluye /payments/, /whatsapp/, /admin/stats, etc.)
        location / {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://backend;
        }

        location @backend {
            proxy_pass http://backend;
        }
    }

    # ======================================================================
    # Bloque HTTPS (descomenta cuando tengas certificados de Let's Encrypt).
    # 1) Reemplaza patitasfind.mx por tu dominio.
