# Configuración principal de Nginx para GuauWoow (se monta en /etc/nginx/nginx.conf).
# Los server {} se generan desde nginx/templates/<modo>/*.template con envsubst (variables DOMAIN
# y NGINX_REAL_IP) en /etc/nginx/conf.d/patitasfind*.conf. NGINX_MODE=https (normal) o http-only
# (para emitir el primer certificado). Ver README-despliegue.md y docs/operacion.md.
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;        # cada conexión con proxy usa 2 descriptores (cliente + backend)
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    # mime.types de nginx no trae .webmanifest (PWA)
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;
    server_tokens off;

    # Request id: se respeta el X-Request-ID entrante (p. ej. el de los webhooks de Mercado Pago) si
    # tiene el mismo formato que acepta el backend; si no, se usa el de Nginx. El mismo valor va al
    # log y al backend, así una petición se rastrea de punta a punta.
    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
        default                   $request_id;
    }

    log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id","ip":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"upstream":"$upstream_response_time","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 12m;          # fotos de hasta 10 MB + margen multipart (/upload permite 25m)

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml
               image/svg+xml application/manifest+json;
    gzip_min_length 256;

    # Rate limiting (por IP real del cliente: detrás de Cloudflare activa NGINX_REAL_IP=cloudflare)
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=otp:10m rate=6r/m;
    limit_req_status 429;

    # WebSocket: Upgrade/Connection solo cuando el cliente los pide (vacío = keepalive al backend)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Respeta X-Forwarded-Proto cuando hay un Nginx/proxy delante en el host
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Fotos subidas: nombres uuid que nunca cambian => caché larga e inmutable. Se agrega con
    # add_header a nivel server (las location no usan add_header; ver patitasfind-locations.conf).
    map $uri $uploads_cache_control {
        "~^/uploads/" "public, max-age=31536000, immutable";
        default       "";
    }

    # DNS interno de Docker: el backend se vuelve a resolver cada 10 s, así Nginx sigue al
    # contenedor nuevo tras un despliegue (o a las 2 réplicas durante el rolling update)
    # sin reiniciarse, y arranca aunque el backend todavía no exista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream backend {
        zone backend_upstream 64k;
        server backend:8000 resolve;
        keepalive 32;
        keepalive_timeout 30s;         # menor que --timeout-keep-alive de uvicorn (65 s)
    }

    # Solo nuestros server {} (no el default.conf de la imagen)
    include /etc/nginx/conf.d/patitasfind*.conf;
}
