# Configuración principal de Nginx para PatitasFind (se monta en /etc/nginx/nginx.conf).
# Los server {} se generan desde nginx/templates/<modo>/*.template con envsubst (variable DOMAIN)
# en /etc/nginx/conf.d/patitasfind*.conf. NGINX_MODE=https (normal) o http-only (para emitir
# el primer certificado). Ver README-despliegue.md.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Log JSON con el mismo request id que recibe el backend (X-Request-ID)
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","ip":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"upstream":"$upstream_response_time","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 12m;          # fotos de hasta 10 MB + margen multipart

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=otp:10m rate=6r/m;
    limit_req_status 429;

    # WebSocket: Upgrade/Connection solo cuando el cliente los pide
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # Solo nuestros server {} (no el default.conf de la imagen)
    include /etc/nginx/conf.d/patitasfind*.conf;
}
