# IP real del cliente detrás de Cloudflare (proxy naranja activado en el DNS).
#
# Cómo activarlo: en .env pon NGINX_REAL_IP=cloudflare y recrea nginx
#   docker compose -f docker-compose.production.yml up -d --no-deps nginx
# (con NGINX_REAL_IP=none, el valor por defecto, se incluye none-realip.conf y no cambia nada).
#
# Sin esto, detrás de Cloudflare todas las peticiones parecen venir de unas pocas IPs de
# Cloudflare: los límites de peticiones (limit_req y los del backend) bloquearían a usuarios
# legítimos y los logs no mostrarían la IP real.
#
# Solo se confía en CF-Connecting-IP cuando la conexión viene de un rango de Cloudflare.
# Rangos oficiales: https://www.cloudflare.com/ips-v4 y https://www.cloudflare.com/ips-v6
# (revisados el 2026-10-16; cambian muy rara vez, revísalos cada pocos meses).

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
