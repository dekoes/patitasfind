# Rutas de PatitasFind (compartidas por los modos https y http-only).
# IMPORTANTE: ninguna location usa add_header, para que hereden los encabezados de
# seguridad definidos a nivel server (en Nginx, un add_header en la location los anula).

# ---------------- Archivos de desarrollo/legado del frontend: nunca se sirven
location ~* (\.(py|pyc|mjs|md|sh|log)$|/package(-lock)?\.json$|/node_modules/|/e2e-shots/|/test-[^/]*$|/_build_index|/app-mvp|/app-demo|/index-demo) {
    return 404;
}
location ~ /\.(?!well-known/) {
    return 404;
}

# ---------------- Landing (/) y sus assets
location = / {
    root /usr/share/nginx/html/app;
    try_files /landing.html =404;
    expires 5m;
}
location = /index.html {
    return 301 /;
}
# landing.css, landing.js, favicon y archivos estáticos de primer nivel;
# si no existe en el frontend, se envía al backend
location ~* ^/[^/]+\.(css|js|png|jpe?g|webp|svg|ico|gif|woff2?|ttf|webmanifest|txt|xml)$ {
    root /usr/share/nginx/html/app;
    try_files $uri @backend;
    expires 1h;
}
location /img/ {
    root /usr/share/nginx/html/app;
    expires 7d;
}

# ---------------- App web (incluye /app/legal/...)
location = /app {
    return 302 /app/;
}
location /app/ {
    alias /usr/share/nginx/html/app/;
    try_files $uri $uri/ /app/index.html;
    expires 1h;
}

# ---------------- Panel de administración (solo estos archivos son estáticos;
# cualquier otra ruta /admin/... es API y va al backend)
location = /admin {
    return 302 /admin/;
}
location = /admin/ {
    root /usr/share/nginx/html/app;
    try_files /admin.html =404;
    expires -1;
}
location = /admin/index.html {
    root /usr/share/nginx/html/app;
    try_files /admin.html =404;
    expires -1;
}
location = /admin/admin.css {
    alias /usr/share/nginx/html/app/admin.css;
    default_type text/css;
}
location = /admin/admin.js {
    alias /usr/share/nginx/html/app/admin.js;
    default_type application/javascript;
}

# ---------------- Uploads (fotos re-codificadas por el backend)
location /uploads/ {
    alias /usr/share/nginx/html/uploads/;
    expires 7d;
}

# ---------------- Endpoints sensibles con límite estricto
location = /auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend;
}
location = /auth/register {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend;
}
location = /auth/forgot-password {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://backend;
}
location = /users/me/phone/send-code {
    limit_req zone=otp burst=2 nodelay;
    proxy_pass http://backend;
}
location = /users/me/phone/verify {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend;
}

# ---------------- WebSocket del chat
location /ws/ {
    proxy_pass http://backend;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ---------------- Búsqueda por foto / IA (subidas y respuestas más lentas)
location /search/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend;
    proxy_read_timeout 120s;
}
location /ai/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend;
    proxy_read_timeout 120s;
}

# ---------------- Todo lo demás es API (incluye /payments/, /whatsapp/, /admin/stats, etc.)
location / {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://backend;
}

location @backend {
    proxy_pass http://backend;
}
