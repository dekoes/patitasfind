# Rutas de GuauWoow (compartidas por los modos https y http-only).
# IMPORTANTE: ninguna location usa add_header, para que hereden los encabezados de
# seguridad definidos a nivel server (en Nginx, un add_header en la location los anula).
# Los encabezados que cambian por ruta (Cache-Control de /uploads/) salen de un map en nginx.conf.

# ---------------- URL absoluta del sitio en archivos estáticos (og:image, canonical, sitemap,
# robots, manifest): el frontend escribe %%SITE_URL%% y aquí se reemplaza por $site_url
# (https://DOMINIO, definido en la plantilla con el DOMAIN configurado, no con el Host del cliente).
sub_filter '%%SITE_URL%%' $site_url;
sub_filter_once off;
sub_filter_types text/plain text/xml application/xml application/manifest+json;   # text/html siempre se incluye

# ---------------- Página 404 para rutas estáticas (la API sigue respondiendo JSON)
error_page 404 /404.html;
location = /404.html {
    root /usr/share/nginx/html/app;
    internal;
    expires 5m;
}

# ---------------- Archivos de desarrollo/legado del frontend y datos internos: nunca se sirven
# (los datos y plantillas legales solo alimentan scripts/render-legal.py; lo público son las páginas generadas)
location ~* (\.(py|pyc|mjs|md|sh|log)$|/package(-lock)?\.json$|/node_modules/|/e2e-shots/|/test-[^/]*$|/_build_index|/app-mvp|/app-demo|/index-demo|/legal/datos-legales[^/]*\.json$|/legal/plantillas/) {
    return 404;
}
location ~ /\.(?!well-known/) {
    return 404;
}

# ---------------- Landing (/) y sus assets
location = / {
    root /usr/share/nginx/html/app;
    try_files /landing.html =404;
    expires 5m;
}
location = /index.html {
    return 301 /;
}
# SEO / PWA / favicon: siempre desde el frontend (nunca del backend)
location ~ ^/(robots\.txt|sitemap\.xml|manifest\.webmanifest|favicon\.(ico|svg|png))$ {
    root /usr/share/nginx/html/app;
    try_files $uri =404;
    expires 1h;
}
# landing.css, landing.js y archivos estáticos de primer nivel;
# si no existe en el frontend, se envía al backend
location ~* ^/[^/]+\.(css|js|png|jpe?g|webp|svg|ico|gif|woff2?|ttf|webmanifest|txt|xml)$ {
    root /usr/share/nginx/html/app;
    try_files $uri @backend;
    expires 1h;
}
location /img/ {
    root /usr/share/nginx/html/app;
    expires 7d;
}

# ---------------- App web (incluye /app/vendor/...)
location = /app {
    return 302 /app/;
}
location /app/ {
    alias /usr/share/nginx/html/app/;
    try_files $uri $uri/ /app/index.html;
    expires 1h;
}

# ---------------- Centro legal (páginas que genera scripts/render-legal.py)
# /app/legal/ muestra centro-legal.html y una página que no existe da 404 (no la app). Las plantillas y los
# datos legales no se sirven (location de archivos internos de arriba). /legal y /legal/<slug> son atajos.
location = /app/legal {
    return 301 /app/legal/;
}
location /app/legal/ {
    alias /usr/share/nginx/html/app/legal/;
    index centro-legal.html;
    try_files $uri $uri/ =404;
    expires 1h;
}
location ~ ^/legal/?$ {
    return 301 /app/legal/;
}
location ~ ^/legal/([a-z0-9-]+?)(?:\.html)?/?$ {
    return 301 /app/legal/$1.html;
}
# security.txt (RFC 9116), generado desde app/legal/plantillas/security.txt
location = /.well-known/security.txt {
    root /usr/share/nginx/html/app;
    default_type text/plain;
    charset utf-8;
    expires 1d;
}
location = /security.txt {
    return 301 /.well-known/security.txt;
}

# ---------------- Panel de administración (solo estos archivos son estáticos;
# cualquier otra ruta /admin/... es API y va al backend)
location = /admin {
    return 302 /admin/;
}
location = /admin/ {
    root /usr/share/nginx/html/app;
    try_files /admin.html =404;
    expires -1;
}
location = /admin/index.html {
    root /usr/share/nginx/html/app;
    try_files /admin.html =404;
    expires -1;
}
location = /admin/admin.css {
    alias /usr/share/nginx/html/app/admin.css;
    default_type text/css;
}
location = /admin/admin.js {
    alias /usr/share/nginx/html/app/admin.js;
    default_type application/javascript;
}

# ---------------- Uploads (fotos re-codificadas por el backend, nombres uuid)
# Documentos privados (actas, INE de refugios): NUNCA públicos; solo GET /admin/documents/{id}.
location ^~ /uploads/private/ {
    return 404;
}
# Solo imágenes; cualquier otro archivo (p. ej. PDFs antiguos de refugios) no se sirve.
# Cache-Control "public, max-age=31536000, immutable" lo agrega el map $uploads_cache_control.
location /uploads/ {
    alias /usr/share/nginx/html/uploads/;
    location ~* \.(jpe?g|png|webp|gif)$ {
    }
    return 404;
}

# ---------------- Subidas de fotos y documentos (POST /upload, /upload/multiple, /upload/document)
location = /upload {
    limit_req zone=api burst=20 nodelay;
    client_max_body_size 25m;
    client_body_buffer_size 1m;
    proxy_pass http://backend;
    proxy_read_timeout 120s;
}
location /upload/ {
    limit_req zone=api burst=20 nodelay;
    client_max_body_size 25m;
    client_body_buffer_size 1m;
    proxy_pass http://backend;
    proxy_read_timeout 120s;
}

# ---------------- Endpoints sensibles con límite estricto
location = /auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend;
}
location = /auth/register {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend;
}
location = /auth/forgot-password {
    limit_req zone=login burst=3 nodelay;
    proxy_pass http://backend;
}
# Segundo paso de los administradores (código de la app de autenticación o de recuperación)
location = /auth/mfa/verify {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend;
}
location = /users/me/phone/send-code {
    limit_req zone=otp burst=2 nodelay;
    proxy_pass http://backend;
}
location = /users/me/phone/verify {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend;
}

# ---------------- WebSocket del chat
location /ws/ {
    proxy_pass http://backend;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ---------------- Búsqueda por foto / IA (subidas y respuestas más lentas)
location /search/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend;
    proxy_read_timeout 120s;
}
location /ai/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://backend;
    proxy_read_timeout 120s;
}

# ---------------- Todo lo demás es API (incluye /reports, /payments/, /whatsapp/, /admin/stats,
# /admin/documents/..., /refuges/me/orders, etc.)
location / {
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://backend;
}

location @backend {
    proxy_pass http://backend;
}
