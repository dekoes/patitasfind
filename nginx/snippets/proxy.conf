# Encabezados hacia el backend (se incluye a nivel server; las location lo heredan)
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Se reemplaza (no se agrega) para que el cliente no pueda falsificar su IP: uvicorn confía en
# X-Forwarded-For (--forwarded-allow-ips=*) y el backend no está expuesto fuera de Docker.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-ID $req_id;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 60s;
# El backend está en la red local de Docker: conectar tarda < 1 ms. Si una réplica acaba de apagarse
# (despliegue), su IP deja de existir y la conexión se colgaría; con 2 s Nginx pasa a la otra réplica.
proxy_connect_timeout 2s;
