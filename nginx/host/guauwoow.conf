# Nginx del host en el VPS multi-proyecto. Instalar en /etc/nginx/sites-available/guauwoow
# y enlazar en /etc/nginx/sites-enabled/guauwoow. Termina TLS y envía el tráfico al Nginx
# de Docker, publicado únicamente en 127.0.0.1:4700.
server {
    server_name guauwoow.com www.guauwoow.com;

    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    if ($host = www.guauwoow.com) {
        return 301 https://guauwoow.com$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/guauwoow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guauwoow.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name guauwoow.com www.guauwoow.com;
    return 301 https://$host$request_uri;
}
